# nginx внутри контейнера ieseditor (CT 120, 192.168.0.150).
# TLS и внешний домен — на NPM (192.168.0.200), здесь только отдача статики
# по HTTP внутри LAN.
#
# ВАЖНО про add_header: в nginx он НЕ наследуется в location, если там есть
# свой add_header. Поэтому политика кэша выбирается через map и все заголовки
# ставятся один раз на уровне server — иначе заголовки безопасности молча
# исчезают на тех путях, где задан свой Cache-Control (проверено: до правки
# X-Frame-Options и X-Content-Type-Options не доходили до браузера).

map $uri $ies_cache_control {
    # файлы с хешем в имени не меняются — можно кэшировать надолго
    ~^/assets/  "public, max-age=31536000, immutable";
    ~^/fonts/   "public, max-age=31536000, immutable";
    # всё остальное, включая index.html: иначе после выкладки у людей
    # останется старая версия приложения
    default     "no-cache, must-revalidate";
}

server {
    listen 80 default_server;
    server_name _;

    root /var/www/ieseditor;
    index index.html;

    # РСЯ требует быстрой загрузки
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    add_header Cache-Control $ies_cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # HSTS ставится здесь, а не в NPM — чтобы не зависеть от настройки панели
    # и не получить дубль заголовка. В NPM галочку HSTS включать не нужно.
    add_header Strict-Transport-Security "max-age=15552000" always;

    location /assets/ { access_log off; }
    location /fonts/ { access_log off; }

    location = /robots.txt { access_log off; }
    location = /sitemap.xml { access_log off; }
    location = /ads.txt { default_type text/plain; access_log off; }

    # служебное: проверка живости для внешнего мониторинга
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
