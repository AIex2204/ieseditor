# nginx внутри контейнера ieseditor (CT 120, 192.168.0.150).
# TLS, HSTS и внешний домен — на NPM (192.168.0.200), здесь только отдача
# статики по HTTP внутри LAN.

server {
    listen 80 default_server;
    server_name _;

    root /var/www/ieseditor;
    index index.html;

    # РСЯ требует быстрой загрузки: сжатие + долгий кэш на файлы с хешем в имени
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # Vite кладёт хеш в имя файла — такие можно кэшировать надолго
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    location /fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # index.html не кэшируем, иначе после выкладки у людей останется старая версия
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Файлы для поисковиков и рекламной сети отдаются как есть
    location = /robots.txt { access_log off; }
    location = /sitemap.xml { access_log off; }
    location = /ads.txt { default_type text/plain; access_log off; }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Заголовки безопасности. CSP разрешает Метрику только когда она нужна;
    # 'unsafe-inline' для стилей требуется Vite-сборке (инлайн-стили React).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # служебное: проверка живости для внешнего мониторинга
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
